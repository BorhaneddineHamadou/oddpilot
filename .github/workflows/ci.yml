name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install physcheck (dev)
        run: pip install -e "physcheck/[dev]"
      - name: Ruff
        run: ruff check physcheck
      - name: Mypy
        run: mypy physcheck/src
      - name: Pytest
        run: pytest physcheck/tests -q
      - name: Validate shipped rule packs
        run: |
          for pack in physcheck/catalog/*.yaml; do
            physcheck rules lint "$pack"
          done
      - name: Self-lint examples (planted violations must be found)
        run: |
          physcheck lint examples/valid --fail-on error
          if physcheck lint examples/violating --fail-on error; then
            echo "expected planted violations to be found" && exit 1
          fi

  odd-pilot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install odd-pilot (dev)
        run: |
          pip install -e physcheck/
          pip install -e "odd-pilot/[dev]"
      - name: Ruff
        run: ruff check odd-pilot/src odd-pilot/tests
      - name: Mypy
        run: mypy --config-file odd-pilot/pyproject.toml odd-pilot/src
      - name: Pytest
        run: pytest odd-pilot/tests -q

  sarif:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install physcheck
        run: pip install -e physcheck/
      - name: Lint examples to SARIF
        run: physcheck lint examples/ --format sarif -o physcheck.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: physcheck.sarif
